<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Fetch Example</title>
  <style>
    .loading {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      color: #555;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }
    .product {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      width: 200px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      height: auto;
    }
    .product-title {
      font-size: 1.2em;
      margin: 10px 0;
    }
    .description, .prize, .data-addtoCart {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="loader" class="loading">Loading...</div>
  <div id="productContainer" class="products" style="display: none;"></div>

  <script>
    function showData() {
      return new Promise(function (resolve, reject) {
        fetch("https://api.escuelajs.co/api/v1/categories")
          .then(function (res) {
            return res.json();
          })
          .then(function (res) {
            resolve(res);
          })
          .catch(function (error) {
            reject(error);
          });
      });
    }

    const loader = document.getElementById("loader");
    const productContainer = document.getElementById("productContainer");

    showData()
      .then(function (res) {
        // Hide the loader
        loader.style.display = "none";
        productContainer.style.display = "flex";

        // Render products
        res.forEach(function (item) {
          const productHtml = `
            <div class="product">
              <img src="${item.image}" alt="${item.name}" class="product-image">
              <h2 class="product-title">${item.name}</h2>
              <p class="description">${item.description || "No description available."}</p>
              <h3 class="prize">Category ID: ${item.id}</h3>
              <a href="#!" class="data-addtoCart">View More</a>
            </div>
          `;
          productContainer.innerHTML += productHtml;
        });
      })
      .catch(function (error) {
        // Show error message
        loader.innerHTML = "Failed to load data. Please try again.";
        console.error(error);
      });
  </script>
</body>
</html>
